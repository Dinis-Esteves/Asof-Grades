name: Update grades

on:
  schedule:
    - cron: "0 17 * * 2-5"  # Tue–Fri 17:00 UTC (= Lisbon time in winter); GitHub may delay scheduled runs
  workflow_dispatch:        # manual "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Reuse PDFs downloaded by earlier runs so only new quizzes are fetched.
      - uses: actions/cache@v4
        with:
          path: data/pdfs
          key: quiz-pdfs-${{ github.run_id }}
          restore-keys: quiz-pdfs-

      - name: Fetch PDFs and build site
        env:
          FENIX_USERNAME: ${{ secrets.FENIX_USERNAME }}
          FENIX_PASSWORD: ${{ secrets.FENIX_PASSWORD }}
          FENIX_COOKIE: ${{ secrets.FENIX_COOKIE }}  # fallback when username/password are unset
        run: uv run asof-grades

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
